<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChunkStream</title>
  <meta name="description" content="Super minimal resumable file transfer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="logo" id="home-link">ChunkStream</h1>
      <p class="tagline">Minimal, direct file transfer</p>
    </header>

    <main class="main">
      <!-- 1. HOME SCREEN: SEND OR RECEIVE -->
      <div class="view" id="view-home">
        <div class="actions-grid">
          <button class="action-card" id="btn-choice-send">
            <div class="icon-circle send-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </div>
            <span class="action-title">Send</span>
            <span class="action-desc">Select a file & get a code</span>
          </button>

          <button class="action-card" id="btn-choice-receive">
            <div class="icon-circle receive-icon">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
              </svg>
            </div>
            <span class="action-title">Receive</span>
            <span class="action-desc">Enter a code to download</span>
          </button>
        </div>
      </div>

      <!-- 2. SENDER SCREEN -->
      <div class="view hidden" id="view-send">
        <div class="card">
          <input type="file" id="file-input" class="hidden-input">

          <!-- Initial: Drop/Select File -->
          <div id="sender-step-pick">
            <div class="drop-box" id="drop-box">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <p class="drop-text">Click or drop a file to send</p>
            </div>
          </div>

          <!-- Waiting & Transferring State -->
          <div id="sender-step-transfer" class="hidden">
            <div class="file-badge">
              <span class="file-name" id="send-file-name">-</span>
              <span class="file-size" id="send-file-size">-</span>
            </div>

            <div class="code-box">
              <span class="code-label">Share this code with receiver</span>
              <div class="code-display" id="sender-code-display">----</div>
              <button type="button" class="btn-copy" id="btn-copy-code">Copy Code</button>
            </div>

            <div class="status-box">
              <div class="status-indicator">
                <span class="pulse-dot" id="sender-status-dot"></span>
                <span class="status-text" id="sender-status-text">Waiting for receiver to connect...</span>
              </div>
              <p class="status-sub" id="sender-status-sub">Transfer will begin automatically once receiver connects</p>
            </div>

            <div class="progress-container hidden" id="sender-progress-box">
              <div class="progress-bar">
                <div class="progress-fill" id="sender-progress-fill" style="width: 0%"></div>
              </div>
              <div class="progress-info">
                <span id="sender-progress-pct">0%</span>
                <span id="sender-progress-details">0 / 0 MB</span>
              </div>
            </div>

            <button type="button" class="btn btn-secondary hidden" id="btn-send-again">Send Another File</button>
          </div>

          <button type="button" class="btn-back" id="btn-back-from-send">← Back</button>
        </div>
      </div>

      <!-- 3. RECEIVER SCREEN -->
      <div class="view hidden" id="view-receive">
        <div class="card">
          <!-- Input Code Step -->
          <div id="receiver-step-input">
            <label for="receive-code-input" class="input-label">Enter 4-digit code</label>
            <input type="text" id="receive-code-input" class="code-input" placeholder="e.g. 7492" maxlength="8" autocomplete="off" autofocus>
            <button type="button" class="btn btn-primary" id="btn-start-receive">Receive File</button>
          </div>

          <!-- Receiving State -->
          <div id="receiver-step-transfer" class="hidden">
            <div class="file-badge">
              <span class="file-name" id="rx-file-name">Connecting...</span>
              <span class="file-size" id="rx-file-size">-</span>
            </div>

            <div class="status-box">
              <div class="status-indicator">
                <span class="pulse-dot green" id="rx-status-dot"></span>
                <span class="status-text" id="rx-status-text">Connecting to sender...</span>
              </div>
            </div>

            <div class="progress-container" id="rx-progress-box">
              <div class="progress-bar">
                <div class="progress-fill green-fill" id="rx-progress-fill" style="width: 0%"></div>
              </div>
              <div class="progress-info">
                <span id="rx-progress-pct">0%</span>
                <span id="rx-progress-details">-</span>
              </div>
            </div>

            <a id="rx-download-link" class="btn btn-primary hidden" download>
              Download File
            </a>

            <button type="button" class="btn btn-secondary hidden" id="btn-receive-again">Receive Another File</button>
          </div>

          <button type="button" class="btn-back" id="btn-back-from-receive">← Back</button>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
